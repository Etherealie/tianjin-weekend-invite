<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1c1e">
  <meta name="description" content="从天津市区和滨海挑一条周末路线，再选想去的景点。">
  <title>周末一起逛天津？</title>
  <style>
    :root {
      color-scheme: dark;
      --deepest: #1c1c1e;
      --mid: #2c2c2e;
      --raised: #3a3a3c;
      --blue: #0a84ff;
      --blue-text: #80bfff;
      --blue-selection: rgba(10, 132, 255, .18);
      --text: rgba(255, 255, 255, .92);
      --muted: rgba(255, 255, 255, .66);
      --line: rgba(255, 255, 255, .10);
      --row-line: rgba(255, 255, 255, .08);
      --hover: rgba(255, 255, 255, .08);
      --serif: Georgia, "New York", "Songti SC", "Noto Serif CJK SC", SimSun, serif;
      --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--text);
      background: var(--deepest);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    h1, h2, h3, p, fieldset, ol { margin: 0; }
    h1 { font: 700 clamp(30px, 4vw, 40px)/1.15 var(--serif); letter-spacing: -.01em; }
    h2, legend { font-size: 17px; font-weight: 600; line-height: 1.3; }
    p { line-height: 1.6; }
    a { color: var(--blue-text); text-underline-offset: 3px; }
    button, textarea { font: inherit; }
    button, summary, label { -webkit-tap-highlight-color: transparent; }
    button, summary, label:has(input) { cursor: pointer; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 1px solid var(--blue); outline-offset: 3px; }
    .route-choice, .pick, button { transition: background-color 200ms ease-out, color 200ms ease-out; }
    main { width: min(calc(100% - 48px), 1120px); height: min(calc(100dvh - 48px), 860px); margin: 24px auto; border: 1px solid var(--line); border-radius: 14px; display: grid; grid-template-rows: 52px minmax(0, 1fr); overflow: hidden; background: var(--mid); box-shadow: 0 1px 0 var(--row-line) inset, 0 20px 48px rgba(0, 0, 0, .5); }
    .window-bar { display: grid; place-items: center; padding-inline: 16px; background: var(--raised); border-bottom: 1px solid var(--line); }
    .window-bar p { font: 400 13px/1.25 var(--serif); }
    #invite { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 0; }
    .sidebar { min-width: 0; padding: 16px 12px; border-right: 1px solid var(--line); background: var(--deepest); background: rgba(28, 28, 30, .8); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); }
    .sidebar legend { padding-inline: 8px; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
    .workspace { min-width: 0; min-height: 0; overflow: auto; padding: 32px clamp(20px, 4vw, 48px); }
    .hero { padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .hero .date { margin-bottom: 8px; font-size: 13px; color: var(--muted); }
    .hero p:last-child { margin-top: 12px; color: var(--muted); }
    fieldset { padding: 0; border: 0; min-width: 0; }
    legend { padding: 0; margin-bottom: 12px; }
    .routes { display: grid; gap: 1px; }
    .route-choice { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 3px 8px; padding: 8px; min-height: 44px; border-radius: 6px; }
    .route-choice + .route-choice { position: relative; }
    .route-choice + .route-choice::before { content: ""; position: absolute; inset: -1px 8px auto; border-top: 1px solid var(--row-line); }
    .route-choice:hover, .pick:hover { background: var(--hover); }
    .route-choice:has(:checked), .pick:has(:checked) { background: var(--blue-selection); }
    .route-choice strong { font-size: 15px; font-weight: 600; }
    .route-choice span { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
    .route-choice small { display: none; }
    input { accent-color: var(--blue); }
    .route-choice input, .pick input { width: 16px; height: 16px; margin: 0; flex: 0 0 auto; }
    .muted { color: var(--muted); }
    .panel { padding: 24px 0; border-bottom: 1px solid var(--line); }
    .panel:last-child { border-bottom: 0; padding-bottom: 0; }
    .picks { display: flex; flex-wrap: wrap; gap: 8px; }
    .pick { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 10px; border: 1px solid var(--row-line); border-radius: 6px; font-size: 13px; }
    .variants { gap: 4px; padding: 4px; background: rgba(255, 255, 255, .06); border-radius: 8px; }
    .variants .pick { border: 0; flex: 1 1 auto; }
    .variants .pick:has(:checked) { background: var(--raised); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); }
    #variant-note { margin-top: 12px; font-size: 13px; }
    .days { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .day { min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid var(--row-line); background: var(--deepest); }
    .day h3 { padding: 0 4px 8px; font-size: 15px; font-weight: 600; }
    .day ol { padding: 0; list-style: none; }
    .day li { min-height: 44px; display: grid; grid-template-columns: 3rem minmax(0, 1fr); align-items: baseline; gap: 8px; padding: 8px 4px; border-top: 1px solid var(--row-line); font-size: 13px; }
    .day time { font: 13px/1.4 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
    .section-title { margin-bottom: 12px; }
    details { margin-top: 12px; }
    summary { min-height: 44px; padding: 11px 0; font-weight: 600; color: var(--blue-text); }
    .legs { padding: 0; list-style: none; }
    .legs li { padding: 8px 0; border-top: 1px solid var(--row-line); }
    .legs strong, .legs span { display: block; font-size: 13px; line-height: 1.6; }
    .legs strong { font-weight: 600; }
    .legs span { color: var(--muted); }
    .helper { margin-top: 8px; font-size: 13px; }
    .preferences { display: grid; gap: 16px; }
    .preferences legend small { margin-left: 4px; font-size: 13px; font-weight: 400; }
    .reply-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    textarea { display: block; width: 100%; min-height: 78px; border: 1px solid var(--line); background: var(--deepest); color: inherit; border-radius: 6px; margin: 12px 0; padding: 8px 12px; line-height: 1.6; resize: vertical; }
    button { min-height: 44px; border-radius: 6px; border: 0; background: var(--blue); color: var(--deepest); font-size: 13px; font-weight: 600; padding: 6px 14px; }
    button:hover { background: #2592ff; }
    button:active { background: #0977e6; }
    #status { font-size: 13px; }
    @media (max-width: 740px) {
      main { width: 100%; min-height: 100vh; min-height: 100dvh; height: auto; margin: 0; display: block; border: 0; border-radius: 0; box-shadow: none; }
      .window-bar { position: sticky; top: 0; height: 52px; z-index: 1; }
      #invite { display: grid; grid-template-columns: 1fr; grid-template-areas: "intro" "routes" "planner"; }
      .sidebar { grid-area: routes; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
      .routes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .route-choice + .route-choice::before { display: none; }
      .route-choice { align-content: start; min-height: 62px; }
      .route-choice strong { font-size: 13px; }
      .route-choice span { font-size: 12px; }
      .workspace { display: contents; }
      .hero { grid-area: intro; padding: 24px 16px; }
      #planner { grid-area: planner; padding: 0 16px 24px; }
    }
    @media (max-width: 560px) {
      .days { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .route-choice, .pick, button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="window-bar">
      <p>天津周末路线</p>
    </header>

    <form id="invite">
      <aside class="sidebar" aria-label="路线选择">
        <fieldset>
            <legend>想去哪边？</legend>
            <div class="routes">
              <label class="route-choice">
                <strong>市区 · 逛老城</strong>
                <input name="route" value="city" type="radio" aria-controls="planner">
                <span>五大道、西开教堂、海河夜景</span>
              </label>
              <label class="route-choice">
                <strong>滨海 · 去看海</strong>
                <input name="route" value="coast" type="radio" aria-controls="planner">
                <span>海博馆、观澜角，也可以去东疆</span>
              </label>
            </div>
        </fieldset>
      </aside>

      <div class="workspace">
        <section class="hero" aria-labelledby="page-title">
          <p class="date">周六中午出发 · 周日下午结束</p>
          <h1 id="page-title">周末一起逛天津？</h1>
          <p>海河夜景、老房子，或者去滨海看海。挑一条你更想走的，再选几个特别想去的地方。</p>
        </section>

        <div id="planner" hidden>
          <section class="panel" aria-labelledby="variant-heading">
            <h2 id="variant-heading" class="section-title">想怎么逛？</h2>
            <div id="variants" class="picks variants" role="group" aria-labelledby="variant-heading"></div>
            <p id="variant-note" class="muted"></p>
          </section>

          <section class="panel" aria-labelledby="schedule-heading">
            <h2 class="section-title" id="schedule-heading">两天怎么走</h2>
            <div class="days" id="days"></div>
            <details id="transit">
              <summary>展开每段路程和交通方式</summary>
              <ul class="legs" id="legs"></ul>
              <p class="helper muted">距离和耗时是估算，候车、找单车和排队另计。到时按导航走。</p>
            </details>
            <p class="helper muted" id="stay"></p>
            <p class="helper" id="links"></p>
          </section>

          <section class="panel preferences" aria-label="想去的景点和出行偏好">
            <fieldset>
              <legend>特别想去哪里？<small class="muted"> 可多选</small></legend>
              <div id="stops" class="picks"></div>
            </fieldset>
            <fieldset>
              <legend>路上你更喜欢</legend>
              <div class="picks">
                <label class="pick"><input type="radio" name="transport" value="以步行为主">慢慢走</label>
                <label class="pick"><input type="radio" name="transport" value="短途骑共享单车">可以骑车</label>
                <label class="pick"><input type="radio" name="transport" value="累了就打车">走累了就打车</label>
                <label class="pick"><input type="radio" name="transport" value="">都可以</label>
              </div>
            </fieldset>
            <fieldset>
              <legend>想玩得多满？</legend>
              <div class="picks">
                <label class="pick"><input type="radio" name="pace" value="想慢慢逛，留点时间吃饭休息">慢慢逛</label>
                <label class="pick"><input type="radio" name="pace" value="想多看看几个地方">想多逛几处</label>
                <label class="pick"><input type="radio" name="pace" value="">都可以</label>
              </div>
            </fieldset>
          </section>

          <section class="panel" aria-labelledby="reply-heading">
            <h2 id="reply-heading">回我一句就好</h2>
            <textarea id="reply" rows="2" readonly aria-labelledby="reply-heading"></textarea>
            <div class="reply-row">
              <button id="copy" type="button">复制回复</button>
              <p class="muted" id="status" role="status"></p>
            </div>
          </section>
        </div>
      </div>
    </form>
  </main>
  <script>
    const citySat = [
      ["12:00", "在市区碰头，吃午饭"],
      ["13:00", "民园广场，沿重庆道、常德道逛五大道"],
      ["14:45", "西开教堂，沿滨江道去赤峰道"],
      ["15:30", "瓷房子和张学良故居，挑一处进去慢慢看"],
      ["17:15", "津湾广场吃晚饭，过解放桥看世纪钟"]
    ];
    const citySun = [
      ["09:00", "梁启超纪念馆和饮冰室"],
      ["10:15", "意风区，逛马可波罗广场"],
      ["11:00", "过金汤桥到古文化街吃小吃"],
      ["12:30", "沿海河走到天津之眼，拍照或坐日场"],
      ["14:30", "结束，按返程车次留时间"]
    ];
    const cityWalk = [
      ["市区住宿点 → 民园广场", "约 2.8–3.6 公里 · 骑车 15–25 分钟，或打车 10–20 分钟"],
      ["五大道北侧 → 西开教堂", "约 1.2–1.8 公里 · 骑车 7–12 分钟，或步行 18–28 分钟"],
      ["西开教堂 → 滨江道 → 赤峰道", "约 1.2–1.6 公里 · 步行 18–25 分钟"],
      ["瓷房子 ↔ 张学良故居", "约 100–200 米 · 步行 2–4 分钟"],
      ["赤峰道 → 津湾广场", "约 1.1–1.5 公里 · 步行 16–23 分钟"],
      ["津湾广场 → 解放桥 → 世纪钟", "约 0.3–0.5 公里 · 步行 5–10 分钟"],
      ["世纪钟 → 市区住宿点", "约 4.5–6 公里 · 打车 15–30 分钟"],
      ["市区住宿点 → 饮冰室", "约 4.5–6 公里 · 打车 15–30 分钟"],
      ["饮冰室 → 马可波罗广场", "约 0.3–0.5 公里 · 步行 5–8 分钟"],
      ["马可波罗广场 → 金汤桥 → 古文化街南口", "约 0.9–1.3 公里 · 步行 13–20 分钟"],
      ["古文化街南口 → 北口", "约 0.6–0.7 公里 · 逛吃留 45–75 分钟"],
      ["古文化街北口 → 金刚桥 → 天津之眼", "约 1.1–1.6 公里 · 步行 16–25 分钟，或骑车 6–10 分钟"],
      ["天津之眼 → 天津站", "约 4–5.5 公里 · 打车 15–30 分钟"]
    ];
    const coastArrival = [
      ["天津市区 → 滨海文化中心", "约 55–70 公里 · 打车 60–100 分钟；也可从天津站坐地铁 9 号线或查城际班次"],
      ["市民广场站或滨海站 → 滨海图书馆", "约 2–3 公里 · 打车 8–15 分钟，或骑车 12–20 分钟"]
    ];
    const coastSun = [
      ["09:15", "入馆逛国家海洋博物馆，留约 2.5 小时"],
      ["11:45", "在海博馆附近吃午饭"],
      ["12:30", "到观澜角沿海边走走，留约半小时"],
      ["13:45", "去返程站，按车次留进站时间"]
    ];
    const coastReturn = [
      ["滨海文化中心或滨海站附近 → 国家海洋博物馆", "约 18–26 公里 · 打车 35–50 分钟"],
      ["国家海洋博物馆 → 观澜角", "约 5–8 公里 · 打车 15–25 分钟"],
      ["观澜角 → 滨海站", "约 20–28 公里 · 打车 40–60 分钟"],
      ["观澜角 → 天津站（如需回市区）", "约 55–70 公里 · 打车 65–105 分钟"]
    ];
    const routes = {
      city: {
        name: "市区线",
        stay: "住宿可选八里台附近。表里涉及住宿点的距离按八里台估算。",
        links: [["西开教堂开放信息", "https://s.visitbeijing.com.cn/attraction/120428"], ["天津之眼票务公告", "https://m.tj.bendibao.com/xiuxian/167820.shtm?src=amap"]],
        variants: {
          classic: {
            name: "经典海河路线",
            note: "周六看解放桥夜景，周日慢慢走到天津之眼。五大道留约一个半小时。",
            sat: citySat, sun: citySun, legs: cityWalk, extra: ["天津之眼日场"]
          },
          night: {
            name: "天津之眼夜场",
            note: "周六拍完世纪钟接着去天津之眼。提前买夜场票，周日逛到古文化街就可以收尾。",
            sat: [...citySat, ["19:00", "打车去永乐桥，按票面时段乘坐天津之眼"]],
            sun: [...citySun.slice(0, 3), ["13:30", "古文化街附近吃饭或返程"]],
            legs: [
              ...cityWalk.slice(0, 6),
              ["世纪钟 → 天津之眼", "约 4–5.5 公里 · 打车 15–25 分钟"],
              ["天津之眼 → 市区住宿点", "约 5.5–7 公里 · 打车 20–35 分钟"],
              ...cityWalk.slice(7, 11)
            ],
            extra: ["天津之眼夜场"]
          },
          church: {
            name: "周日先去教堂",
            note: "西开教堂挪到周日，想参加弥撒可以先电话确认场次，后面的时间按实际场次顺延。",
            sat: [citySat[0], citySat[1], ["14:45", "直接去赤峰道，顺路逛滨江道"], ...citySat.slice(3)],
            sun: [["按场次", "先去西开教堂"], ...citySun],
            legs: [
              cityWalk[0],
              ["五大道 → 赤峰道", "约 1.7–2.3 公里 · 骑车 9–15 分钟"],
              ...cityWalk.slice(3, 7),
              ["市区住宿点 → 西开教堂", "约 2–3 公里 · 骑车 12–20 分钟"],
              ["西开教堂 → 饮冰室", "约 3.5–5 公里 · 打车 15–25 分钟"],
              ...cityWalk.slice(8)
            ],
            extra: ["周日弥撒", "天津之眼日场"]
          }
        },
        stops: ["五大道", "西开教堂", "滨江道", "瓷房子", "张学良故居", "解放桥和世纪钟夜景", "饮冰室", "意风区", "古文化街小吃"]
      },
      coast: {
        name: "滨海线",
        stay: "住滨海文化中心或滨海站附近方便返程。方特玩法也可以住生态城，周日更靠近海博馆。",
        links: [["海博馆预约须知", "https://www.nmmc.cc/?active_id=165"], ["观澜角位置", "https://www.eco-city.gov.cn/p1/stcxw/20250529/58559.html"]],
        variants: {
          easy: {
            name: "图书馆＋海博馆",
            note: "周六留时间吃饭、休息，周日逛海博馆和观澜角。海博馆常设展可免费实名预约。",
            sat: [["12:00", "市区吃午饭后出发"], ["14:00", "滨海图书馆中心馆区，看看中庭"], ["15:00", "在文化中心附近歇会儿，傍晚吃饭、入住"]],
            sun: coastSun,
            legs: [...coastArrival, ["图书馆 → 滨海文化中心附近酒店", "约 0.5–2 公里 · 步行 8–30 分钟"], ...coastReturn],
            extra: ["滨海图书馆"]
          },
          dongjiang: {
            name: "加去东疆看海",
            note: "周六看东疆，周日看观澜角。两处在不同片区，周六尽量在天黑前到东疆。",
            sat: [["12:00", "从市区出发"], ["14:00", "滨海图书馆中心馆区"], ["15:00", "打车去东疆亲海公园"], ["17:00", "回滨海文化中心一带吃晚饭、入住"]],
            sun: coastSun,
            legs: [...coastArrival, ["图书馆 → 东疆亲海公园", "约 14–20 公里 · 打车 30–45 分钟"], ["东疆亲海公园 → 滨海文化中心或滨海站附近", "约 14–22 公里 · 打车 30–50 分钟"], ...coastReturn],
            extra: ["滨海图书馆", "东疆亲海公园"]
          },
          polar: {
            name: "换成极地海洋公园",
            note: "周六优先看活体动物和表演。出园还有时间再去滨海图书馆，按当天演出和开馆时间安排。",
            sat: [["12:00", "从市区出发，查合适的城际班次"], ["14:00", "游玩极地海洋公园"], ["傍晚", "视开馆时间去滨海图书馆，再吃晚饭"]],
            sun: coastSun,
            legs: [coastArrival[0], ["滨海站 → 极地海洋公园", "约 4–7 公里 · 打车 12–20 分钟"], ["极地海洋公园 → 滨海图书馆（可选）", "约 6–9 公里 · 打车 15–25 分钟"], ...coastReturn],
            extra: ["极地海洋公园", "滨海图书馆"],
            link: ["极地海洋公园营业时间", "https://www.haichangoceanpark.com/tianjin/park-hour"]
          },
          fantawild: {
            name: "换成方特",
            note: "把周六下午留给方特，优先玩想玩的项目。先看当天营业时间，再定出发时间。",
            sat: [["12:00", "从市区或滨海站往生态城出发"], ["下午", "方特欢乐世界"], ["傍晚", "在生态城吃饭、入住"]],
            sun: coastSun,
            legs: [["滨海站 → 方特", "约 25–35 公里 · 打车 40–60 分钟"], ["方特 → 生态城附近酒店", "按酒店位置打车"], ["生态城酒店 → 国家海洋博物馆", "车程按酒店位置和当天导航估算"], ...coastReturn.slice(1)],
            extra: ["方特欢乐世界"],
            link: ["天津方特官网", "https://tianjin.fangte.com/"]
          }
        },
        stops: ["国家海洋博物馆", "观澜角"]
      }
    };

    const byId = (id) => document.getElementById(id);
    const form = byId("invite");
    const planner = byId("planner");
    const variants = byId("variants");
    const stops = byId("stops");
    const reply = byId("reply");
    const status = byId("status");
    const remembered = { city: { picks: new Set() }, coast: { picks: new Set() } };
    let currentRoute;

    function element(tag, text) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function choice(type, name, value, label, checked) {
      const control = element("input");
      Object.assign(control, { type, name, value, checked });
      const wrapper = element("label");
      wrapper.className = "pick";
      wrapper.append(control, label);
      return wrapper;
    }

    function makeDay(title, entries) {
      const day = element("section");
      day.className = "day";
      const list = element("ol");
      for (const [time, description] of entries) {
        const row = element("li");
        const clockTime = /^\d\d:\d\d$/.test(time);
        const timeLabel = element(clockTime ? "time" : "span", time);
        if (clockTime) timeLabel.dateTime = time;
        else timeLabel.className = "muted";
        row.append(timeLabel, element("span", description));
        list.append(row);
      }
      day.append(element("h3", title), list);
      return day;
    }

    function renderRoute() {
      const route = routes[currentRoute];
      const plan = remembered[currentRoute];
      const entry = route.variants[plan.variant];
      byId("variant-note").textContent = entry.note;
      byId("days").replaceChildren(makeDay("周六", entry.sat), makeDay("周日", entry.sun));
      byId("legs").replaceChildren(...entry.legs.map(([name, travel]) => {
        const item = element("li");
        item.append(element("strong", name), element("span", travel));
        return item;
      }));
      byId("stay").textContent = route.stay;
      const links = entry.link ? [...route.links, entry.link] : route.links;
      byId("links").replaceChildren();
      for (const [index, [label, href]] of links.entries()) {
        const link = element("a", label);
        Object.assign(link, { href, target: "_blank", rel: "noopener noreferrer" });
        byId("links").append(index ? " · " : "", link);
      }
      const visibleStops = [...route.stops, ...entry.extra];
      stops.replaceChildren(...visibleStops.map(label => choice("checkbox", "stop", label, label, plan.picks.has(label))));
      updateReply();
    }

    function updateReply() {
      const route = routes[currentRoute];
      const entry = route.variants[remembered[currentRoute].variant];
      const values = new FormData(form);
      const favoriteStops = values.getAll("stop");
      const transport = values.get("transport");
      const pace = values.get("pace");
      const preference = [transport, pace].filter(Boolean);
      reply.value = `我想选${route.name}，走「${entry.name}」！`
        + (favoriteStops.length ? `特别想去：${favoriteStops.join("、")}。` : "")
        + (preference.length ? `路上${preference.join("，")}。` : "");
      status.textContent = "";
    }

    function selectRoute(key) {
      currentRoute = key;
      const plan = remembered[key];
      const options = Object.entries(routes[key].variants);
      plan.variant ??= options[0][0];
      variants.replaceChildren(...options.map(([value, entry]) => choice("radio", "variant", value, entry.name, value === plan.variant)));
      planner.hidden = false;
      renderRoute();
    }

    form.addEventListener("change", ({target}) => {
      if (target.name === "route") {
        selectRoute(target.value);
      } else if (target.name === "variant") {
        remembered[currentRoute].variant = target.value;
        renderRoute();
      } else if (currentRoute) {
        if (target.name === "stop") {
          const picks = remembered[currentRoute].picks;
          if (target.checked) picks.add(target.value);
          else picks.delete(target.value);
        }
        updateReply();
      }
    });

    async function copyReply() {
      try {
        await navigator.clipboard.writeText(reply.value);
      } catch {
        reply.focus();
        reply.select();
        reply.setSelectionRange(0, reply.value.length);
        status.textContent = "已选中回复，可以手动复制。";
        return;
      }
      status.textContent = "已复制，可以粘贴回聊天。";
    }

    byId("copy").addEventListener("click", copyReply);
    const initial = new FormData(form).get("route");
    if (initial) selectRoute(initial);
  </script>
</body>
</html>
